name: PR checks

# Everything that needs no device. The suite itself does not run here — there is no
# Android emulator in CI yet — so specs are still validated locally before a PR is
# opened (CLAUDE.md). This catches what a local run cannot: a lockfile another npm
# version rejects, and anything someone forgot to run.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:unit
